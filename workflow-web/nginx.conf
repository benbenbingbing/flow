map $http_x_forwarded_proto $flow_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $flow_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 管理端与 Open API 共享后台 Origin，但后台 Origin 上的任何响应都不能被 iframe 嵌入。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Embed 入口、静态资源和 Runtime API 只能从独立 Embed Origin 访问。
    # 这里必须先于后台 SPA/API 的宽泛路由 fail closed，防止同源边界被绕过。
    location = /embed-assets { return 404; }
    location ^~ /embed-assets/ { return 404; }
    location = /embed/v1 { return 404; }
    location ^~ /embed/v1/ { return 404; }
    location = /api/embed/v1 { return 404; }
    location ^~ /api/embed/v1/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${SERVER_UPSTREAM}/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $flow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $flow_forwarded_proto;
    }

    location /oauth2/ {
        proxy_pass http://${SERVER_UPSTREAM}/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $flow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $flow_forwarded_proto;
    }
}

# Embed Runtime 使用独立端口，由独立 Service/Ingress Host 发布为不同 Origin。
# 本 VHost 没有 SPA fallback、普通 /api/** 或 OAuth 路由，未知路径统一返回 404。
server {
    listen 8081;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # TLS 在 Ingress 终止；若可信代理没有声明 HTTPS，则不返回任何 Embed 内容。
    if ($flow_forwarded_proto != "https") {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 后端根据 Launch 的 parentOrigin 返回唯一、精确的 frame-ancestors CSP；
    # 此处不得追加管理端的 frame-ancestors 'none'。
    location ~ "^/embed/v1/launches/lch_[A-Za-z0-9_-]{16,60}$" {
        proxy_pass http://${SERVER_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $flow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $flow_forwarded_proto;
    }

    # Embed 构建产物物理分目录且禁止回退到后台 index.html。
    location ^~ /embed-assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ^~ /api/embed/v1/ {
        proxy_pass http://${SERVER_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $flow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $flow_forwarded_proto;
    }

    location / {
        return 404;
    }
}
