apiVersion: v1
kind: Namespace
metadata:
  name: flow-observability
  labels:
    app.kubernetes.io/name: flow-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-prometheus
  namespace: flow-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-promtail
  namespace: flow-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flow-observability-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flow-observability-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flow-observability-prometheus
subjects:
  - kind: ServiceAccount
    name: flow-prometheus
    namespace: flow-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flow-observability-promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flow-observability-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flow-observability-promtail
subjects:
  - kind: ServiceAccount
    name: flow-promtail
    namespace: flow-observability
