apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-promtail-config
  namespace: flow-observability
data:
  promtail.yml: |
    server:
      http_listen_port: 3101
      log_level: info

    positions:
      filename: /run/promtail/positions.yml

    clients:
      - url: http://flow-loki.flow-observability.svc.cluster.local:3100/loki/api/v1/push
        timeout: 2s
        backoff_config:
          min_period: 500ms
          max_period: 5s
          max_retries: 5

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: log.level
                message: message
                service_name: service.name
                trace_id: trace.id
                span_id: span.id
                request_id: request_id
                business_trace_id: business_trace_id
          - labels:
              level:
              service_name:
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flow-hardening
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: flow-hardening
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            regex: ([^;]+);([^;]+);([^;]+);([^;]+)
            replacement: /var/log/pods/${1}_${2}_${3}/${4}/*.log
            source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flow-promtail
  namespace: flow-observability
  labels:
    app.kubernetes.io/name: flow-promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-promtail
    spec:
      serviceAccountName: flow-promtail
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.5.1
          imagePullPolicy: IfNotPresent
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - -config.file=/etc/promtail/promtail.yml
          ports:
            - name: http
              containerPort: 3101
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: positions
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: flow-promtail-config
        - name: positions
          emptyDir:
            sizeLimit: 16Mi
        - name: pods
          hostPath:
            path: /var/log/pods
