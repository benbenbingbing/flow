apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-grafana-provisioning
  namespace: flow-observability
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://flow-prometheus.flow-observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://flow-loki.flow-observability.svc.cluster.local:3100
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://flow-tempo.flow-observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: flow
        orgId: 1
        folder: Flow
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-grafana-dashboard
  namespace: flow-observability
data:
  flow-observability.json: |
    {
      "uid": "flow-observability-lite",
      "title": "Flow Production Observability",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["flow", "local-k3s"],
      "panels": [
        {
          "type": "stat",
          "title": "Flow Server Scrape",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "up{job=\"flow-server\"}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests",
          "gridPos": {"x": 6, "y": 0, "w": 9, "h": 8},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{application=\"workflow-server\"}[5m]))"}
          ]
        },
        {
          "type": "timeseries",
          "title": "JVM Memory",
          "gridPos": {"x": 15, "y": 0, "w": 9, "h": 8},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(jvm_memory_used_bytes{application=\"workflow-server\"}) by (area)"}
          ]
        },
        {
          "type": "logs",
          "title": "Flow Logs",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {"datasource": {"type": "loki", "uid": "loki"}, "expr": "{namespace=\"flow-hardening\"} | json"}
          ]
        },
        {
          "type": "traces",
          "title": "Flow Traces",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {"datasource": {"type": "tempo", "uid": "tempo"}, "query": "{resource.service.name=\"workflow-server\"}"}
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-grafana
  namespace: flow-observability
  labels:
    app.kubernetes.io/name: flow-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: flow-grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: flow-grafana-provisioning
        - name: dashboard
          configMap:
            name: flow-grafana-dashboard
        - name: data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flow-grafana
  namespace: flow-observability
  labels:
    app.kubernetes.io/name: flow-grafana
spec:
  selector:
    app.kubernetes.io/name: flow-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
