apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-prometheus-config
  namespace: flow-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: local-k3s
        cluster: local-k3s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: flow-server
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - flow-local-flow-server.flow-hardening.svc.cluster.local:9090
            labels:
              service: workflow-server
              namespace: flow-hardening

      - job_name: otel-collector
        static_configs:
          - targets:
              - flow-otel-collector.flow-observability.svc.cluster.local:8888

  rules.yml: |
    groups:
      - name: flow.local
        rules:
          - alert: FlowMetricsScrapeMissing
            expr: absent(up{job="flow-server"} == 1)
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Flow server metrics scrape is missing

          - alert: FlowServerTargetDown
            expr: up{job="flow-server"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Flow server metrics target is down

          - alert: FlowHighHttp5xxRatio
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{
                  application="workflow-server",
                  status=~"5..",
                  uri!~"/actuator/.*|/healthz|/livez"}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{
                  application="workflow-server",
                  status!~"4..",
                  uri!~"/actuator/.*|/healthz|/livez"}[5m])), 1)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Flow HTTP 5xx ratio is above the local objective

          - alert: FlowControlledTestAlert
            expr: vector(1)
            for: 0m
            labels:
              severity: info
              controlled_test: "true"
            annotations:
              summary: Controlled local alert used to verify alert loading
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-prometheus
  namespace: flow-observability
  labels:
    app.kubernetes.io/name: flow-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-prometheus
    spec:
      serviceAccountName: flow-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
            - --storage.tsdb.retention.size=256MB
            - --enable-feature=exemplar-storage
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: flow-prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flow-prometheus
  namespace: flow-observability
  labels:
    app.kubernetes.io/name: flow-prometheus
spec:
  selector:
    app.kubernetes.io/name: flow-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
