global:
  existingSecret: flow-local-secrets
  allowMutableImages: true

server:
  image:
    repository: flow-hardening/server
    tag: observability-local
    digest: ""
    pullPolicy: Never
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  pool:
    databaseMax: 5
    tomcatMaxThreads: 30
    applicationMaxThreads: 6
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 2
    cpuUtilization: 70
    memoryUtilization: 80

web:
  image:
    repository: flow-hardening/web
    tag: g3-final
    digest: ""
    pullPolicy: Never
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70

schemaWorker:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

database:
  url: jdbc:mysql://local-mysql:3306/workflow?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true
  migrationConnectRetries: 30

storage:
  endpoint: http://minio:9000
  region: us-east-1
  bucket: workflow-files
  accessUrl: ""
  pathStyleAccess: true

application:
  corsAllowedOrigins: "http://127.0.0.1:18081,http://127.0.0.1:18083,http://127.0.0.1:3000,http://localhost:3000"
  trustForwardedHeaders: false
  httpAllowedHosts: ""
  logLevel: INFO
  shutdownTimeout: 30s
  environment: local-k3s
  version: observability-local

observability:
  tracing:
    enabled: true
    otlpEndpoint: http://flow-otel-collector.flow-observability.svc.cluster.local:4318/v1/traces
    otlpTimeout: 2s
    samplingProbability: "0.1"

openApi:
  enabled: false
  trustForwardedHeaders: false
  trustedProxyCidrs: []

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 5s
  prometheusRule:
    enabled: true

ingress:
  enabled: false

networkPolicy:
  enabled: true
  allowSameNamespaceDependencies: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: flow-hardening
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: flow-observability
  observabilityNamespaceSelector:
    kubernetes.io/metadata.name: flow-observability
  observabilityCollectorCIDRs: []
  databaseCIDRs: []
  objectStorageCIDRs: []
  outboundHttpsCIDRs: []

topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
