name: flow

x-runtime-environment: &runtime-environment
  SPRING_PROFILES_ACTIVE: production
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-workflow}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true
  DB_USERNAME: ${DB_USERNAME:-workflow}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  SPRING_FLYWAY_ENABLED: "false"
  FLOWABLE_SCHEMA_UPDATE: "false"
  FILE_STORAGE_TYPE: s3
  FILE_STORAGE_S3_ENDPOINT: ${FILE_STORAGE_S3_ENDPOINT:?FILE_STORAGE_S3_ENDPOINT is required}
  FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
  FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:?FILE_STORAGE_S3_BUCKET is required}
  FILE_STORAGE_S3_ACCESS_KEY: ${FILE_STORAGE_S3_ACCESS_KEY:?FILE_STORAGE_S3_ACCESS_KEY is required}
  FILE_STORAGE_S3_SECRET_KEY: ${FILE_STORAGE_S3_SECRET_KEY:?FILE_STORAGE_S3_SECRET_KEY is required}
  FILE_STORAGE_S3_ACCESS_URL: ${FILE_STORAGE_S3_ACCESS_URL:-}
  FILE_STORAGE_S3_PATH_STYLE: ${FILE_STORAGE_S3_PATH_STYLE:-false}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  CONFIG_MIGRATION_SIGNING_KEY: ${CONFIG_MIGRATION_SIGNING_KEY:?CONFIG_MIGRATION_SIGNING_KEY is required}
  LOGGING_LEVEL_COM_WORKFLOW: ${APP_LOG_LEVEL:-INFO}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-workflow}
      MYSQL_USER: ${DB_USERNAME:-workflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SCHEMA_DB_USERNAME: ${SCHEMA_DB_USERNAME:?SCHEMA_DB_USERNAME is required}
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?SCHEMA_DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migration:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    pull_policy: never
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint:
      - java
      - -jar
      - /app/workflow-db-migrator.jar
    environment:
      SCHEMA_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-workflow}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true
      SCHEMA_DB_USERNAME: ${SCHEMA_DB_USERNAME:?SCHEMA_DB_USERNAME is required}
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?SCHEMA_DB_PASSWORD is required}

  schema-worker:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migration:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -jar
      - /app/workflow-db-migrator.jar
    environment:
      MIGRATION_COMMAND: schema-worker
      SCHEMA_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-workflow}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true
      SCHEMA_DB_USERNAME: ${SCHEMA_DB_USERNAME:?SCHEMA_DB_USERNAME is required}
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?SCHEMA_DB_PASSWORD is required}

  bootstrap:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    pull_policy: never
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      WORKFLOW_DEPLOYMENT_ROLE: bootstrap
      WORKFLOW_BOOTSTRAP_ENABLED: "true"
      WORKFLOW_BOOTSTRAP_EXIT_ON_COMPLETE: "true"
      WORKFLOW_SCHEDULING_ENABLED: "false"
      WORKFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${WORKFLOW_BOOTSTRAP_ADMIN_PASSWORD:?WORKFLOW_BOOTSTRAP_ADMIN_PASSWORD is required}

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      schema-worker:
        condition: service_started
    environment:
      <<: *runtime-environment
      SERVER_PORT: 8080
      WORKFLOW_DEPLOYMENT_ROLE: server
      WORKFLOW_BOOTSTRAP_ENABLED: "false"
      WORKFLOW_BOOTSTRAP_EXIT_ON_COMPLETE: "false"
      WORKFLOW_SCHEDULING_ENABLED: "true"
      WORKFLOW_SCHEMA_PUBLISHER_MODE: queue
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
