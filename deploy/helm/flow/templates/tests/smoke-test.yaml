apiVersion: v1
kind: Pod
metadata:
  name: {{ include "flow.fullname" . }}-smoke-test
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: default
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke-test
      image: {{ include "flow.image" (dict "root" . "image" .Values.server.image) }}
      imagePullPolicy: {{ .Values.server.image.pullPolicy }}
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          attempt=0
          until curl --fail --silent --show-error --max-time 10 \
              http://{{ include "flow.fullname" . }}-server:8080/healthz; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              exit 1
            fi
            sleep 2
          done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
