apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow.fullname" . }}-server
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "flow.componentLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow.componentLabels" (dict "root" . "component" "server") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (dict "database" .Values.database "storage" .Values.storage "application" .Values.application "openApi" .Values.openApi) | sha256sum }}
    spec:
      serviceAccountName: {{ include "flow.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "flow.image" (dict "root" . "image" .Values.server.image) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.url | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: FLOWABLE_SCHEMA_UPDATE
              value: "false"
            - name: FLOWABLE_ASYNC_EXECUTOR_ACTIVATE
              value: "true"
            - name: WORKFLOW_DEPLOYMENT_ROLE
              value: server
            - name: WORKFLOW_BOOTSTRAP_ENABLED
              value: "false"
            - name: WORKFLOW_BOOTSTRAP_EXIT_ON_COMPLETE
              value: "false"
            - name: WORKFLOW_SCHEDULING_ENABLED
              value: "true"
            - name: WORKFLOW_SCHEMA_PUBLISHER_MODE
              value: queue
            - name: FILE_STORAGE_TYPE
              value: s3
            - name: FILE_STORAGE_S3_ENDPOINT
              value: {{ .Values.storage.endpoint | quote }}
            - name: FILE_STORAGE_S3_REGION
              value: {{ .Values.storage.region | quote }}
            - name: FILE_STORAGE_S3_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: FILE_STORAGE_S3_ACCESS_URL
              value: {{ .Values.storage.accessUrl | quote }}
            - name: FILE_STORAGE_S3_PATH_STYLE
              value: {{ .Values.storage.pathStyleAccess | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.application.corsAllowedOrigins | quote }}
            - name: TRUST_FORWARDED_HEADERS
              value: {{ .Values.application.trustForwardedHeaders | quote }}
            - name: WORKFLOW_HTTP_ALLOWED_HOSTS
              value: {{ .Values.application.httpAllowedHosts | quote }}
            - name: WORKFLOW_LOG_LEVEL
              value: {{ .Values.application.logLevel | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.application.shutdownTimeout | quote }}
            - name: WORKFLOW_OPEN_API_ENABLED
              value: {{ .Values.openApi.enabled | quote }}
            - name: WORKFLOW_OPEN_API_ISSUER
              value: {{ .Values.openApi.issuer | quote }}
            - name: WORKFLOW_OPEN_API_AUDIENCE
              value: {{ .Values.openApi.audience | quote }}
            - name: WORKFLOW_OPEN_API_ACCESS_TOKEN_TTL
              value: {{ .Values.openApi.accessTokenTtl | quote }}
            - name: WORKFLOW_OPEN_API_KEY_ID
              value: {{ .Values.openApi.keyId | quote }}
            - name: WORKFLOW_OPEN_API_TOKEN_CLIENT_LIMIT
              value: {{ .Values.openApi.tokenClientLimitPerMinute | quote }}
            - name: WORKFLOW_OPEN_API_TOKEN_ADDRESS_LIMIT
              value: {{ .Values.openApi.tokenAddressLimitPerMinute | quote }}
            - name: WORKFLOW_OPEN_API_TRUST_FORWARDED_HEADERS
              value: {{ .Values.openApi.trustForwardedHeaders | quote }}
            - name: WORKFLOW_OPEN_API_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.openApi.trustedProxyCidrs | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_ENABLED
              value: {{ .Values.openApi.webhook.enabled | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_WORKER_CONCURRENCY
              value: {{ .Values.openApi.webhook.workerConcurrency | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_WORKER_QUEUE_CAPACITY
              value: {{ .Values.openApi.webhook.workerQueueCapacity | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_WORKER_BATCH_SIZE
              value: {{ .Values.openApi.webhook.workerBatchSize | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_WORKER_LEASE_SECONDS
              value: {{ .Values.openApi.webhook.workerLeaseSeconds | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_WORKER_DELAY_MS
              value: {{ .Values.openApi.webhook.workerDelayMs | quote }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_METRICS_REFRESH_MS
              value: {{ .Values.openApi.webhook.metricsRefreshMs | quote }}
            {{- if .Values.openApi.webhook.enabled }}
            - name: WORKFLOW_OPEN_API_WEBHOOK_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: {{ .Values.openApi.webhook.masterKeySecretKey }}
            {{- end }}
            {{- if .Values.openApi.enabled }}
            - name: WORKFLOW_OPEN_API_PRIVATE_KEY_LOCATION
              value: file:/var/run/flow-open-api-keys/current-private.pem
            - name: WORKFLOW_OPEN_API_PUBLIC_KEY_LOCATION
              value: file:/var/run/flow-open-api-keys/current-public.pem
            - name: WORKFLOW_OPEN_API_PREVIOUS_PUBLIC_KEYS
              value: {{ include "flow.openApiPreviousPublicKeys" . | quote }}
            {{- end }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.server.pool.databaseMax | quote }}
            - name: SERVER_TOMCAT_THREADS_MAX
              value: {{ .Values.server.pool.tomcatMaxThreads | quote }}
            - name: APPLICATION_EXECUTOR_MAX_SIZE
              value: {{ .Values.server.pool.applicationMaxThreads | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- include "flow.secretEnv" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.openApi.enabled }}
            - name: open-api-signing-keys
              mountPath: /var/run/flow-open-api-keys
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.openApi.enabled }}
        - name: open-api-signing-keys
          secret:
            secretName: {{ .Values.global.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.openApi.privateKeySecretKey }}
                path: current-private.pem
              - key: {{ .Values.openApi.publicKeySecretKey }}
                path: current-public.pem
              {{- range .Values.openApi.previousPublicKeys }}
              - key: {{ .secretKey }}
                path: {{ .fileName }}
              {{- end }}
        {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "flow.componentLabels" (dict "root" . "component" "server") | nindent 14 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "flow.componentLabels" (dict "root" . "component" "server") | nindent 20 }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
