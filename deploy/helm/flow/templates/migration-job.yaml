apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flow.fullname" . }}-migration
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "flow.componentLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      serviceAccountName: default
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: {{ include "flow.image" (dict "root" . "image" .Values.server.image) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - java
            - -jar
            - /app/workflow-db-migrator.jar
          env:
            - name: SCHEMA_DATASOURCE_URL
              value: {{ .Values.database.url | quote }}
            - name: MIGRATION_CONNECT_RETRIES
              value: {{ .Values.database.migrationConnectRetries | quote }}
            {{- include "flow.schemaSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.schemaWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
