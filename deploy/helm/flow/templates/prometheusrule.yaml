{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "flow.fullname" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "flow.fullname" . }}.availability
      rules:
        - alert: FlowReadyReplicaShortage
          expr: |
            kube_deployment_status_replicas_available{
              namespace="{{ .Release.Namespace }}",
              deployment="{{ include "flow.fullname" . }}-server"}
              < {{ .Values.monitoring.prometheusRule.minimumReadyReplicas }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Flow has fewer ready server replicas than required
            runbook_url: deploy/runbooks/incident-response.md#availability
        - alert: FlowHighHttp5xxRatio
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{
                application="workflow-server",status=~"5..",
                uri!~"/actuator/.*|/healthz|/livez"}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{
                application="workflow-server",
                status!~"4..",
                uri!~"/actuator/.*|/healthz|/livez"}[5m])), 1)
            ) > {{ .Values.monitoring.prometheusRule.http5xxRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Flow HTTP 5xx ratio is above the configured threshold
            runbook_url: deploy/runbooks/incident-response.md#http-errors
    - name: {{ include "flow.fullname" . }}.authentication
      rules:
        - alert: FlowAuthenticationFailuresHigh
          expr: |
            sum(increase(flow_auth_session_events_total{
              application="workflow-server",
              result=~"AUTH_.*"}[5m]))
              > {{ .Values.monitoring.prometheusRule.authFailureCount }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Browser authentication failures increased sharply
            runbook_url: deploy/runbooks/incident-response.md#authentication
        - alert: FlowJwtInvalidHigh
          expr: |
            sum(increase(flow_auth_session_events_total{
              application="workflow-server",
              action="access",
              result="AUTH_ACCESS_INVALID"}[5m]))
              > {{ .Values.monitoring.prometheusRule.jwtInvalidCount }}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Invalid JWT signatures or malformed access tokens increased sharply
            runbook_url: deploy/runbooks/incident-response.md#authentication
    - name: {{ include "flow.fullname" . }}.workers
      rules:
        - alert: FlowDurableQueueDeadItems
          expr: |
            max(workflow_queue_items{
              application="workflow-server",state="dead"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Flow has dead durable queue items
            runbook_url: deploy/runbooks/incident-response.md#durable-queues
        - alert: FlowDurableQueueStalled
          expr: |
            max(workflow_queue_oldest_ready_seconds{
              application="workflow-server"})
              > {{ .Values.monitoring.prometheusRule.queueOldestReadySeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Flow durable queue processing is stalled
            runbook_url: deploy/runbooks/incident-response.md#durable-queues
        - alert: FlowDatabasePoolContention
          expr: |
            max(hikaricp_connections_pending{
              application="workflow-server"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Flow requests are waiting for database connections
            runbook_url: deploy/runbooks/incident-response.md#database
        - alert: FlowMetricsScrapeMissing
          expr: |
            absent(up{
              namespace="{{ .Release.Namespace }}",
              service="{{ include "flow.fullname" . }}-server"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Prometheus is not scraping Flow server metrics
            runbook_url: deploy/runbooks/incident-response.md#metrics-missing
{{- end }}
