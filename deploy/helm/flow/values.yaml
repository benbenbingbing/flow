global:
  existingSecret: flow-production-secrets
  allowMutableImages: false
  imagePullSecrets: []

server:
  image:
    repository: registry.example.com/flow-server
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  pool:
    databaseMax: 20
    tomcatMaxThreads: 100
    applicationMaxThreads: 16
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1

web:
  image:
    repository: registry.example.com/flow-web
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
  pdb:
    enabled: true
    minAvailable: 1

schemaWorker:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  url: jdbc:mysql://mysql.example.internal:3306/workflow?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true
  migrationConnectRetries: 30

storage:
  endpoint: https://s3.example.internal
  region: us-east-1
  bucket: flow-production
  accessUrl: ""
  pathStyleAccess: false

application:
  corsAllowedOrigins: ""
  trustForwardedHeaders: true
  httpAllowedHosts: ""
  logLevel: INFO
  shutdownTimeout: 30s
  environment: production
  version: "1.0.0"

observability:
  tracing:
    enabled: false
    otlpEndpoint: http://flow-otel-collector:4318/v1/traces
    otlpTimeout: 500ms
    samplingProbability: "0.05"

openApi:
  enabled: false
  issuer: https://flow.example.com
  audience: flow-open-api
  accessTokenTtl: 10m
  keyId: ""
  privateKeySecretKey: open-api-private-key
  publicKeySecretKey: open-api-public-key
  previousPublicKeys: []
  tokenClientLimitPerMinute: 30
  tokenAddressLimitPerMinute: 300
  trustForwardedHeaders: false
  trustedProxyCidrs: []
  webhook:
    enabled: false
    masterKeySecretKey: webhook-master-key
    workerConcurrency: 4
    workerQueueCapacity: 200
    workerBatchSize: 100
    workerLeaseSeconds: 30
    workerDelayMs: 1000
    metricsRefreshMs: 15000

connector:
  http:
    enabled: false
    masterKeyVersion: ""
    masterKeySecretKey: integration-connector-master-key
    previousMasterKeysSecretKey: ""

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}
    minimumReadyReplicas: 2
    http5xxRatio: 0.05
    queueOldestReadySeconds: 300
    webhookOldestPendingSeconds: 300
    webhookSuccessRatio: 0.95
    webhookMinimumAttempts: 10
    connectorSuccessRatio: 0.95
    connectorMinimumAttempts: 10

ingress:
  enabled: false
  className: nginx
  host: flow.example.com
  tlsSecretName: flow-tls
  annotations: {}

networkPolicy:
  enabled: true
  allowSameNamespaceDependencies: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  observabilityNamespaceSelector:
    kubernetes.io/metadata.name: flow-observability
  observabilityCollectorCIDRs: []
  # Replace these example networks with the resolved, stable dependency CIDRs.
  databaseCIDRs:
    - 10.0.0.0/24
  objectStorageCIDRs:
    - 10.0.1.0/24
  outboundHttpsCIDRs: []

topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
