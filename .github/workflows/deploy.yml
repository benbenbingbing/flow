name: 生产部署

run-name: 生产部署 · ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }} · ${{ github.actor }}

on:
  workflow_run:
    workflows:
      - 持续集成
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署生产环境
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: 阿里云flow
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '8.145.54.70' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/flow' }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 验证部署配置
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$IMAGE_TAG"
          test -n "$DEPLOY_SSH_KEY"

      - name: 检出已验证的提交
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: 配置容器构建环境
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 构建后端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-server
          load: true
          tags: flow-server:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: 构建前端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-web
          load: true
          tags: flow-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # - name: 检查后端镜像漏洞
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      #   with:
      #     scan-type: image
      #     image-ref: flow-server:${{ env.IMAGE_TAG }}
      #     format: table
      #     exit-code: '1'
      #     severity: CRITICAL,HIGH

      # - name: 检查前端镜像漏洞
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      #   with:
      #     scan-type: image
      #     image-ref: flow-web:${{ env.IMAGE_TAG }}
      #     format: table
      #     exit-code: '1'
      #     severity: CRITICAL,HIGH

      - name: 打包已验证镜像
        run: |
          docker save \
            "flow-server:$IMAGE_TAG" \
            "flow-web:$IMAGE_TAG" |
            gzip -1 > "flow-images-$IMAGE_TAG.tar.gz"
          gzip -t "flow-images-$IMAGE_TAG.tar.gz"

      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            printf '%s\n' \
              '8.145.54.70 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJo4ztiHhsKgHHVhcF9W2ULkGpZoZ0QjITkmzsy9b19Z' \
              > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          {
            printf '%s\n' 'Host flow-deploy'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  HostKeyAlias %s\n' "$DEPLOY_HOST"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  IdentitiesOnly yes' \
              '  BatchMode yes' \
              '  StrictHostKeyChecking yes' \
              '  ConnectTimeout 30' \
              '  ServerAliveInterval 15' \
              '  ServerAliveCountMax 8' \
              '  TCPKeepAlive yes' \
              '  ControlMaster auto' \
              '  ControlPersist 15m' \
              '  ControlPath ~/.ssh/flow-%C'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: 建立 SSH 连接
        run: |
          for attempt in $(seq 1 12); do
            if ssh flow-deploy \
              "mkdir -p '$DEPLOY_PATH'"; then
              ssh -O check flow-deploy
              exit 0
            fi

            delay=$((attempt * 10))
            echo "SSH is not ready (attempt $attempt/12); retrying in ${delay}s..."
            sleep "$delay"
          done

          echo "Unable to establish a reusable SSH connection." >&2
          exit 1

      - name: 上传部署文件
        run: |
          for attempt in $(seq 1 5); do
            if scp \
              deploy/compose.ecs.yml \
              deploy/deploy.sh \
              "flow-images-$IMAGE_TAG.tar.gz" \
              "flow-deploy:$DEPLOY_PATH/"; then
              exit 0
            fi

            delay=$((attempt * 20))
            echo "Upload failed (attempt $attempt/5); retrying in ${delay}s..."
            sleep "$delay"
          done

          echo "Unable to upload deployment files." >&2
          exit 1

      - name: 部署已验证镜像
        run: |
          ssh flow-deploy \
            "set -eu; \
             gzip -dc '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz' | docker load; \
             rm -f '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz'; \
             chmod +x '$DEPLOY_PATH/deploy.sh'; \
             cd '$DEPLOY_PATH' && \
             DEPLOY_DIR='$DEPLOY_PATH' \
             COMPOSE_FILE='compose.ecs.yml' \
             IMAGE_TAG='$IMAGE_TAG' \
             SERVER_IMAGE='flow-server:$IMAGE_TAG' \
             WEB_IMAGE='flow-web:$IMAGE_TAG' \
             WAIT_TIMEOUT=900 \
             ./deploy.sh"

      - name: 关闭 SSH 连接
        if: always()
        run: ssh -O exit flow-deploy || true
