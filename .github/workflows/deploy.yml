name: Build and Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: 阿里云flow
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/flow' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-server
          load: true
          tags: flow-server:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-web
          load: true
          tags: flow-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-server:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-web:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate server SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-server:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: server-sbom.cdx.json

      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-web:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: web-sbom.cdx.json

      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-sbom-${{ env.IMAGE_TAG }}
          path: '*-sbom.cdx.json'
          if-no-files-found: error
          retention-days: 90

      - name: Package images
        run: |
          docker save \
            "flow-server:$IMAGE_TAG" \
            "flow-web:$IMAGE_TAG" |
            gzip -1 > "flow-images-$IMAGE_TAG.tar.gz"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/mysql-init'"

      - name: Upload deployment files
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 -P "$DEPLOY_PORT" \
            deploy/compose.prod.yml \
            deploy/deploy.sh \
            "flow-images-$IMAGE_TAG.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -o BatchMode=yes -o ConnectTimeout=15 -P "$DEPLOY_PORT" \
            deploy/mysql-init/10-database-users.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/mysql-init/"

      - name: Deploy tested images
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
             gzip -dc '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz' | docker load; \
             rm -f '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz'; \
             chmod +x '$DEPLOY_PATH/deploy.sh'; \
             cd '$DEPLOY_PATH' && \
             DEPLOY_DIR='$DEPLOY_PATH' \
             IMAGE_TAG='$IMAGE_TAG' \
             SERVER_IMAGE='flow-server:$IMAGE_TAG' \
             WEB_IMAGE='flow-web:$IMAGE_TAG' \
             ./deploy.sh"
