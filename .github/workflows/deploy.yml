name: Build and Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: 阿里云flow
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/flow' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'flow-production' }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'flow' }}
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image repositories
        id: images
        shell: bash
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "server=ghcr.io/$owner/flow-server" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/flow-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        id: server-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-server
          push: true
          tags: ${{ steps.images.outputs.server }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web image
        id: web-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-web
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.server }}@${{ steps.server-image.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.web }}@${{ steps.web-image.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate server SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.server }}@${{ steps.server-image.outputs.digest }}
          format: cyclonedx
          output: server-sbom.cdx.json

      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.web }}@${{ steps.web-image.outputs.digest }}
          format: cyclonedx
          output: web-sbom.cdx.json

      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-sbom-${{ env.IMAGE_TAG }}
          path: '*-sbom.cdx.json'
          if-no-files-found: error
          retention-days: 90

      - name: Package Helm chart
        run: |
          tar -C deploy/helm -czf "flow-chart-$IMAGE_TAG.tar.gz" flow

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Upload deployment files
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 -P "$DEPLOY_PORT" \
            "flow-chart-$IMAGE_TAG.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy immutable images with Helm
        env:
          SERVER_IMAGE: ${{ steps.images.outputs.server }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' \
             K8S_NAMESPACE='$K8S_NAMESPACE' HELM_RELEASE='$HELM_RELEASE' \
             SERVER_IMAGE='$SERVER_IMAGE' SERVER_DIGEST='$SERVER_DIGEST' \
             WEB_IMAGE='$WEB_IMAGE' WEB_DIGEST='$WEB_DIGEST' sh -se" <<'REMOTE'
          set -eu
          command -v helm >/dev/null
          command -v kubectl >/dev/null
          test -f "$DEPLOY_PATH/values.production.yaml"
          chart_directory="$DEPLOY_PATH/chart-$IMAGE_TAG"
          mkdir -p "$chart_directory"
          tar -C "$chart_directory" -xzf \
            "$DEPLOY_PATH/flow-chart-$IMAGE_TAG.tar.gz"
          helm upgrade --install "$HELM_RELEASE" "$chart_directory/flow" \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --values "$DEPLOY_PATH/values.production.yaml" \
            --set-string server.image.repository="$SERVER_IMAGE" \
            --set-string server.image.digest="$SERVER_DIGEST" \
            --set-string web.image.repository="$WEB_IMAGE" \
            --set-string web.image.digest="$WEB_DIGEST" \
            --atomic \
            --timeout 15m \
            --wait
          kubectl -n "$K8S_NAMESPACE" rollout status \
            "deployment/$HELM_RELEASE-flow-server" --timeout=10m
          kubectl -n "$K8S_NAMESPACE" rollout status \
            "deployment/$HELM_RELEASE-flow-web" --timeout=10m
          helm -n "$K8S_NAMESPACE" test "$HELM_RELEASE" \
            --logs --timeout 5m
          rm -f "$DEPLOY_PATH/flow-chart-$IMAGE_TAG.tar.gz"
          REMOTE
