name: Build and Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: 阿里云flow
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '8.145.54.70' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/flow' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: ./workflow-server
          load: true
          tags: flow-server:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./workflow-web
          load: true
          tags: flow-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Package images
        run: |
          docker save \
            "flow-server:$IMAGE_TAG" \
            "flow-web:$IMAGE_TAG" |
            gzip -1 > "flow-images-$IMAGE_TAG.tar.gz"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            printf '%s\n' \
              '8.145.54.70 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJo4ztiHhsKgHHVhcF9W2ULkGpZoZ0QjITkmzsy9b19Z' \
              > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          {
            printf '%s\n' 'Host flow-deploy'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  HostKeyAlias %s\n' "$DEPLOY_HOST"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  IdentitiesOnly yes' \
              '  BatchMode yes' \
              '  StrictHostKeyChecking yes' \
              '  ConnectTimeout 30' \
              '  ServerAliveInterval 15' \
              '  ServerAliveCountMax 8' \
              '  TCPKeepAlive yes' \
              '  ControlMaster auto' \
              '  ControlPersist 15m' \
              '  ControlPath ~/.ssh/flow-%C'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Open SSH connection
        run: |
          for attempt in $(seq 1 12); do
            if ssh flow-deploy "mkdir -p '$DEPLOY_PATH'"; then
              ssh -O check flow-deploy
              exit 0
            fi

            delay=$((attempt * 10))
            echo "SSH is not ready (attempt $attempt/12); retrying in ${delay}s..."
            sleep "$delay"
          done

          echo "Unable to establish a reusable SSH connection." >&2
          exit 1

      - name: Upload deployment files
        run: |
          for attempt in $(seq 1 5); do
            if scp \
              deploy/compose.prod.yml \
              deploy/deploy.sh \
              "flow-images-$IMAGE_TAG.tar.gz" \
              "flow-deploy:$DEPLOY_PATH/"; then
              exit 0
            fi

            delay=$((attempt * 20))
            echo "Upload failed (attempt $attempt/5); retrying in ${delay}s..."
            sleep "$delay"
          done

          echo "Unable to upload deployment files." >&2
          exit 1

      - name: Deploy tested images
        run: |
          ssh flow-deploy \
            "set -eu; \
             gzip -dc '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz' | docker load; \
             rm -f '$DEPLOY_PATH/flow-images-$IMAGE_TAG.tar.gz'; \
             chmod +x '$DEPLOY_PATH/deploy.sh'; \
             cd '$DEPLOY_PATH' && \
             DEPLOY_DIR='$DEPLOY_PATH' \
             IMAGE_TAG='$IMAGE_TAG' \
             SERVER_IMAGE='flow-server:$IMAGE_TAG' \
             WEB_IMAGE='flow-web:$IMAGE_TAG' \
             WAIT_TIMEOUT=900 \
             ./deploy.sh"

      - name: Close SSH connection
        if: always()
        run: ssh -O exit flow-deploy || true
