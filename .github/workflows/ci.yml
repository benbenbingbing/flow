name: 持续集成

run-name: 持续集成 · ${{ github.ref_name }} · ${{ github.actor }}

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端测试与校验
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: workflow-server
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 配置 Java 构建环境
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 执行测试与架构校验
        run: mvn -B -ntp verify

  web:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workflow-web
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 配置 Node.js 构建环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: workflow-web/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org

      - name: 检查依赖安全公告
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: 执行测试
        run: npm test

      - name: 构建生产版本
        run: npm run build

  manifests:
    name: 部署清单校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 验证生产与本地部署清单
        run: deploy/scripts/validate-manifests.sh

  images:
    name: 镜像构建与安全检查
    needs:
      - server
      - web
      - manifests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 配置容器构建环境
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 构建后端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-server
          load: true
          tags: flow-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: 构建前端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workflow-web
          load: true
          tags: flow-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 检查后端镜像漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-server:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: 检查前端镜像漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-web:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: 生成后端软件物料清单
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-server:${{ github.sha }}
          format: cyclonedx
          output: server-sbom.cdx.json

      - name: 生成前端软件物料清单
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flow-web:${{ github.sha }}
          format: cyclonedx
          output: web-sbom.cdx.json

      - name: 保存软件物料清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: '*-sbom.cdx.json'
          if-no-files-found: error
          retention-days: 30

  production-deploy:
    name: 生产部署
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
