name: 开放集成契约校验

run-name: 开放集成契约校验 · ${{ github.ref_name }} · ${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: open-integration-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI 与开放流程契约
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码和基线历史
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 执行 OpenAPI 兼容性和事件 Schema 测试
        env:
          OPENAPI_BASE_REF: >-
            ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        working-directory: workflow-server
        run: >-
          mvn -B -ntp -pl workflow-app -am
          -Dtest=OpenIntegrationContractTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 校验前端生产构建
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: workflow-web/package-lock.json

      - name: 构建前端
        working-directory: workflow-web
        run: npm ci --registry=https://registry.npmjs.org && npm run build
