          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]+$'
      additionalProperties: false
    EmbedBridgeErrorPayload:
      type: object
      required:
        - errorCode
        - message
        - traceId
        - recoverable
      properties:
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
        message:
          type: string
          maxLength: 512
        traceId:
          type:
            - string
            - 'null'
          maxLength: 256
        recoverable:
          type: boolean
        category:
          type: string
          enum:
            - SESSION
            - IDENTITY
            - ORIGIN
            - RESOURCE
            - TRANSIENT
            - UNKNOWN
        phase:
          type: string
          maxLength: 64
        relaunchRequired:
          type: boolean
      additionalProperties: false
    SessionExpiredEventPayload:
      type: object
      required:
        - reason
        - relaunchRequired
      properties:
        reason:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
        relaunchRequired:
          type: boolean
          const: true
      additionalProperties: false
    NavigationRequestEventPayload:
      type: object
      description: 仅 SDK 预留 Schema；当前 iframe Bridge 不发送
      required:
        - target
        - recordId
      properties:
        target:
          type: string
          enum:
            - LIST
            - CREATE
            - VIEW
            - BACK
        recordId:
          oneOf:
            - $ref: '#/components/schemas/RecordId'
            - type: 'null'
      additionalProperties: false
    ActionStartedEventPayload:
      type: object
      description: 仅 SDK 预留 Schema；V1 没有 Action Runtime，当前 iframe Bridge 不发送
      required:
        - actionKey
        - clientMutationId
      properties:
        actionKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
        clientMutationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]+$'
      additionalProperties: false
    ActionCompletedEventPayload:
      type: object
      description: 仅 SDK 预留 Schema；V1 没有 Action Runtime，当前 iframe Bridge 不发送
      required:
        - actionKey
        - receiptId
        - result
      properties:
        actionKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
        receiptId:
          type: string
          pattern: '^eor_[A-Za-z0-9_-]{16,64}$'
        result:
          description: SDK 只接受深度和数量受限的安全 JSON；V1 不产生该 Payload
      additionalProperties: false
    CloseRequestedEventPayload:
      type: object
      description: 仅 SDK 预留 Schema；当前 iframe Bridge 不发送
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 128
      additionalProperties: false
    HostRecordProjection:
      type: object
      required:
        - id
        - values
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        values:
          $ref: '#/components/schemas/ProjectedValues'
      additionalProperties: false

    EntryMode:
      type: string
      enum:
        - LIST
        - CREATE
        - VIEW
    SurfaceType:
      type: string
      enum:
        - LIST
        - FORM
    V1Capability:
      type: string
      enum:
        - LIST_QUERY
        - SELECTION_RETURN
        - RECORD_VIEW
        - RECORD_CREATE
    ExternalFieldType:
      type: string
      enum:
        - TEXT
        - NUMBER
        - BOOLEAN
        - DATE
        - DATETIME
        - TIME
        - SELECT
        - MULTI_SELECT
      description: >-
        成功发布的 V1 表单/列表投影类型。表单中的引用、Lookup 和主体选择类字段在发布时阻断，
        因而不会出现在成功响应中。
    ListFilterOperator:
      type: string
      enum:
        - EQ
        - CONTAINS
        - IN
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
    FieldCode:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_]{0,99}$'
      maxLength: 100
    RecordId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
    ChannelId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]{16,128}$'
    HandshakeNonce:
      type: string
      minLength: 43
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]{43,128}$'
      description: base64url 编码且解码后至少 32 字节
    ScalarValue:
      oneOf:
        - type: string
          maxLength: 2048
        - type: number
        - type: boolean
        - type: 'null'
    NonNullScalarValue:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 2048
        - type: number
        - type: boolean
    ClientValue:
      oneOf:
        - $ref: '#/components/schemas/ScalarValue'
        - type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScalarValue'
    ProjectedValues:
      type: object
      maxProperties: 100
      additionalProperties:
        $ref: '#/components/schemas/ClientValue'
