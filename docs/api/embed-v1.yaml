      additionalProperties: false
    ListItem:
      type: object
      required:
        - id
        - recordVersion
        - values
        - meta
        - actions
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        recordVersion:
          type: 'null'
          description: V1 未启用通用 record_version
        values:
          $ref: '#/components/schemas/ProjectedValues'
        meta:
          $ref: '#/components/schemas/ListItemMeta'
        actions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionCapability'
      additionalProperties: false
    ListItemMeta:
      type: object
      required:
        - updatedAt
      properties:
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    ActionCapability:
      type: object
      required:
        - visible
        - enabled
        - reason
      properties:
        visible:
          type: boolean
        enabled:
          type: boolean
        reason:
          type:
            - string
            - 'null'
      additionalProperties: false
    ListResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ListResult'

    FormMode:
      type: string
      enum:
        - CREATE
        - VIEW
    FormResult:
      type: object
      required:
        - mode
        - record
        - form
      properties:
        mode:
          $ref: '#/components/schemas/FormMode'
        record:
          oneOf:
            - $ref: '#/components/schemas/RecordView'
            - type: 'null'
          description: CREATE 为 null，VIEW 为当前已鉴权记录
        form:
          $ref: '#/components/schemas/FormView'
      additionalProperties: false
    FormView:
      type: object
      required:
        - title
        - layout
        - fields
        - returnableFields
        - actions
      properties:
        title:
          type: string
        layout:
          $ref: '#/components/schemas/FormLayout'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        returnableFields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FieldCode'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/FormActionDescriptor'
      additionalProperties: false
    FormLayout:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      additionalProperties: false
    FormField:
      type: object
      required:
        - code
        - label
        - type
        - required
        - readOnly
        - hidden
        - defaultValue
        - validation
        - options
        - optionSource
        - lookupSource
        - layout
        - fieldState
      properties:
        code:
          $ref: '#/components/schemas/FieldCode'
        label:
          type: string
        type:
          $ref: '#/components/schemas/ExternalFieldType'
        required:
          type: boolean
        readOnly:
          type: boolean
        hidden:
          type: boolean
        defaultValue:
          $ref: '#/components/schemas/ClientValue'
        validation:
          $ref: '#/components/schemas/FormValidationRules'
        options:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/FormOption'
        optionSource:
          oneOf:
            - $ref: '#/components/schemas/OptionSource'
            - type: 'null'
        lookupSource:
          type: 'null'
          description: 当前 V1 不发布可用的非空 Lookup Source；已注册查询路由保持 Fail Closed
        layout:
          $ref: '#/components/schemas/FieldLayout'
        fieldState:
          $ref: '#/components/schemas/FieldState'
      additionalProperties: false
    FormValidationRules:
      type: object
      description: V1 不允许任意 pattern；发布和运行时均 Fail Closed
      properties:
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 0
        minimum:
          type: number
        maximum:
          type: number
        format:
          type: string
          enum:
            - EMAIL
            - PHONE
            - URL
            - URI
      additionalProperties: false
    FormOption:
      type: object
      required:
        - label
        - value
        - disabled
      properties:
        label:
          type: string
          maxLength: 200
        value:
          $ref: '#/components/schemas/ScalarValue'
        disabled:
          type: boolean
      additionalProperties: false
    OptionSource:
      type: object
      required:
        - mode
        - queryUrl
        - dependencyPolicy
      properties:
        mode:
          type: string
          const: RUNTIME
        queryUrl:
          type: string
          pattern: '^/api/embed/v1/runtime/form/fields/[A-Za-z][A-Za-z0-9_]{0,99}/options/query$'
        dependencyPolicy:
          type: array
          maxItems: 0
          description: 大型静态选项不依赖浏览器字段；动态依赖 V1 未开放
          items:
            $ref: '#/components/schemas/DependencyPolicy'
      additionalProperties: false
    DependencyPolicy:
      type: object
      required:
        - code
        - source
      properties:
        code:
          $ref: '#/components/schemas/FieldCode'
        source:
          type: string
          enum:
            - CLIENT_WRITABLE
            - CURRENT_RECORD_READONLY
            - CONTEXT
            - CONSTANT
      additionalProperties: false
    FieldLayout:
      type: object
      required:
        - span
      properties:
        span:
          type: integer
          minimum: 1
          maximum: 24
      additionalProperties: false
    FieldState:
      type: object
      required:
        - visible
        - writable
      properties:
        visible:
          type: boolean
        writable:
          type: boolean
      additionalProperties: false
    FormActionDescriptor:
      type: object
      required:
        - key
        - label
        - placement
        - kind
        - transport
        - recordMode
        - selectionMode
        - dataSchema
        - requiresRecordVersion
        - inputSchema
        - idempotencyRequired
        - enabled
        - disabledReason
      properties:
        key:
          type: string
          const: save
        label:
          type: string
        placement:
          type: string
          const: FORM
        kind:
          type: string
          const: MUTATION
        transport:
          type: string
          const: RECORD_CREATE
        recordMode:
          type: string
          const: NONE
        selectionMode:
          type: string
          const: NONE
        dataSchema:
          type: object
          description: 当前字段状态生成的封闭 JSON Schema
          additionalProperties: true
        requiresRecordVersion:
          type: boolean
          const: false
        inputSchema:
          type: 'null'
        idempotencyRequired:
          type: boolean
          const: true
        enabled:
          type: boolean
        disabledReason:
          type:
            - string
            - 'null'
      additionalProperties: false
    FormResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FormResult'

    CreateFormEvaluationRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          maxProperties: 100
          description: 允许部分草稿；键必须属于固定发布 fieldPolicy.writable
          additionalProperties:
            $ref: '#/components/schemas/ClientValue'
      additionalProperties: false
    CreateFormEvaluationResult:
      allOf:
        - $ref: '#/components/schemas/FormResult'
        - type: object
          properties:
            mode:
              type: string
              const: CREATE
            record:
              type: 'null'
    CreateFormEvaluationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CreateFormEvaluationResult'

    OptionQueryRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/FormMode'
        recordId:
          $ref: '#/components/schemas/RecordId'
        keyword:
          type:
            - string
            - 'null'
          maxLength: 200
        dependencies:
          type: object
          maxProperties: 0
          description: 当前 V1 静态分页实现必须为空
          additionalProperties:
            $ref: '#/components/schemas/ClientValue'
        pageNum:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      allOf:
        - if:
            properties:
              mode:
                const: VIEW
          then:
            required:
              - recordId
        - if:
            properties:
              mode:
                const: CREATE
          then:
            not:
              required:
                - recordId
      additionalProperties: false
    LookupQueryRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/FormMode'
        recordId:
          $ref: '#/components/schemas/RecordId'
        keyword:
          type:
            - string
            - 'null'
          maxLength: 200
        filters:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: '#/components/schemas/ClientValue'
        pageNum:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      allOf:
        - if:
            properties:
              mode:
                const: VIEW
          then:
            required:
              - recordId
        - if:
            properties:
              mode:
                const: CREATE
          then:
            not:
              required:
                - recordId
      additionalProperties: false
    OptionPage:
      type: object
      required:
        - items
        - hasMore
        - pageNum
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FormOption'
        hasMore:
          type: boolean
        pageNum:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
      additionalProperties: false
    OptionPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OptionPage'

    RecordView:
      type: object
      required:
        - id
        - recordVersion
        - values
        - meta
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        recordVersion:
          type: 'null'
          description: 当前 V1 动态实体没有通用 record_version
        values:
          $ref: '#/components/schemas/ProjectedValues'
        meta:
          $ref: '#/components/schemas/RecordMeta'
      additionalProperties: false
    RecordMeta:
      type: object
      required:
        - createdAt
        - updatedAt
      properties:
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    RecordFieldState:
      type: object
      required:
        - visible
        - readOnly
        - required
      properties:
        visible:
          type: boolean
        readOnly:
          type: boolean
          const: true
        required:
          type: boolean
      additionalProperties: false
    RecordResult:
      type: object
      required:
        - record
        - fieldStates
        - actions
      properties:
        record:
          $ref: '#/components/schemas/RecordView'
        fieldStates:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RecordFieldState'
        actions:
          type: object
          maxProperties: 0
          description: 当前 V1 Entity 表单 VIEW 适配器固定返回空对象
          additionalProperties: false
      additionalProperties: false
    RecordResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RecordResult'

    CreateRecordRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/ClientValue'
        clientMutationId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]*[!-~][\x20-\x7E]*$'
      additionalProperties: false
    CreateResult:
      type: object
      required:
        - receiptId
        - record
        - effects
        - clientMutationId
      properties:
        receiptId:
          type: string
          pattern: '^eor_[A-Za-z0-9_-]{16,64}$'
        record:
          $ref: '#/components/schemas/RecordView'
        effects:
          type: array
          maxItems: 0
        clientMutationId:
          type:
            - string
            - 'null'
      additionalProperties: false
    CreateResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          description: HTTP 为 201；现有 EmbedApiEnvelope.ok 的 body code 固定为 200
          properties:
            code:
              type: integer
              const: 200
            data:
              $ref: '#/components/schemas/CreateResult'

    SuccessEnvelopeBase:
      type: object
      required:
        - code
        - message
        - errorCode
        - data
        - traceId
      properties:
        code:
          type: integer
          const: 200
        message:
          type: string
          const: ok
        errorCode:
          type: 'null'
        data: true
        traceId:
          type: string
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - errorCode
        - data
        - traceId
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: string
        errorCode:
          $ref: '#/components/schemas/PublicErrorCode'
        data: true
        traceId:
          type: string
      additionalProperties: false
    FormValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            code:
              type: integer
              const: 422
            errorCode:
              type: string
              const: FORM_VALIDATION_FAILED
            data:
              $ref: '#/components/schemas/FormValidationErrorData'
    FormValidationErrorData:
      type: object
      required:
        - violations
        - relaunchRequired
      properties:
        violations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FormViolation'
        relaunchRequired:
          type: boolean
          const: false
      additionalProperties: false
    FormViolation:
      type: object
      required:
        - path
        - code
        - message
      properties:
        path:
          type: string
          pattern: '^data(?:\.[A-Za-z][A-Za-z0-9_]{0,99})?$'
        code:
          type: string
        message:
          type: string
      additionalProperties: false

    PublicErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - INVALID_ACCESS_TOKEN
        - INSUFFICIENT_SCOPE
        - SOURCE_ADDRESS_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - EMBED_CONTEXT_INVALID
        - EMBED_VIEW_NOT_GRANTED
        - EMBED_ORIGIN_NOT_ALLOWED
        - EMBED_IDENTITY_ASSERTION_INVALID
        - EMBED_IDENTITY_ASSERTION_REPLAYED
        - EXTERNAL_IDENTITY_NOT_MAPPED
        - FLOW_USER_DISABLED
        - EMBED_VIEW_DISABLED
        - EMBED_ACCESS_DENIED
        - EMBED_OPERATION_NOT_ALLOWED
        - EMBED_LAUNCH_INVALID
        - EMBED_LAUNCH_EXPIRED
        - EMBED_SESSION_INVALID
        - EMBED_SESSION_EXPIRED
        - EMBED_SESSION_REVOKED
        - EMBED_SESSION_LIMIT_EXCEEDED
        - RATE_LIMIT_EXCEEDED
        - EMBED_RESOURCE_NOT_FOUND
        - EMBED_IDEMPOTENCY_KEY_REUSED
        - EMBED_REQUEST_IN_PROGRESS
        - FORM_VALIDATION_FAILED
        - EMBED_RECORD_CONFLICT
        - EMBED_RUNTIME_UNAVAILABLE
        - INTEGRATION_TEMPORARILY_UNAVAILABLE

