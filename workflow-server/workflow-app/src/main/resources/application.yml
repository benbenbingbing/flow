server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: workflow-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workflow}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&nullCatalogMeansCurrent=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  flyway:
    enabled: true
    url: ${SCHEMA_DATASOURCE_URL}
    user: ${SCHEMA_DB_USERNAME}
    password: ${SCHEMA_DB_PASSWORD}
    locations: classpath:db/migration
    encoding: UTF-8
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.workflow.entity
  type-handlers-package: com.workflow.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flowable 配置
flowable:
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:true}
  async-executor-activate: true
  history-level: full
  db-history-used: true

# 日志配置
logging:
  file:
    name: logs/workflow-server.log
  level:
    root: INFO
    com.workflow: ${WORKFLOW_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"

# 文件上传配置
file:
  storage:
    type: local
    local:
      path: ${FILE_STORAGE_PATH:./uploads}
      access-url: ${FILE_STORAGE_ACCESS_URL:/uploads}

workflow:
  bootstrap:
    admin:
      password: ${WORKFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  schema-publisher:
    datasource:
      url: ${SCHEMA_DATASOURCE_URL}
      username: ${SCHEMA_DB_USERNAME}
      password: ${SCHEMA_DB_PASSWORD}
  outbox:
    delay-ms: ${OUTBOX_DELAY_MS:3000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:120}
    executor:
      concurrency: ${OUTBOX_EXECUTOR_CONCURRENCY:4}
      queue-capacity: ${OUTBOX_EXECUTOR_QUEUE_CAPACITY:200}
    retry-initial-seconds: ${OUTBOX_RETRY_INITIAL_SECONDS:30}
    retry-max-seconds: ${OUTBOX_RETRY_MAX_SECONDS:3600}
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
  audit:
    enqueue-retries: ${AUDIT_ENQUEUE_RETRIES:3}
    payload-max-length: ${AUDIT_PAYLOAD_MAX_LENGTH:32768}
    retention-days: ${AUDIT_RETENTION_DAYS:365}
  flow-action:
    execution-delay-ms: ${FLOW_ACTION_EXECUTION_DELAY_MS:5000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_ACCESS_TTL_MS:900000}

config:
  migration:
    signing-key: ${CONFIG_MIGRATION_SIGNING_KEY}
    environment-name: ${CONFIG_MIGRATION_ENVIRONMENT_NAME:local}
