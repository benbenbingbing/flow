# 应用配置入口：只声明服务身份和分组文件；默认值在各分组维护，生产差异在 application-production.yml 覆盖。

# Spring Boot 配置入口，启动阶段加载下列必需资源。
spring:
  # 服务身份，供监控标签与运行时识别使用。
  application:
    # 应用名称，同时作为 application、service 指标标签的默认值。
    name: workflow-server
  # 使用 Config Data 机制加载分组文件，保持原属性绑定方式。
  config:
    # 必需资源不加 optional；各分组避免重复定义同一属性，防止依赖导入顺序覆盖默认值。
    import:
      # 运行基础配置。
      - classpath:config/runtime.yml
      # 数据库配置。
      - classpath:config/database.yml
      # 流程与后台执行配置。
      - classpath:config/process.yml
      # 认证与审计配置。
      - classpath:config/security.yml
      # 文件存储配置。
      - classpath:config/storage.yml
      # 外部集成配置。
      - classpath:config/integration.yml
      # 第三方嵌入配置。
      - classpath:config/embed.yml
      # 可观测性配置。
      - classpath:config/observability.yml
