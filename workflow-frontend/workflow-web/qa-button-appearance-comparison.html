<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>按钮外观设计对照</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: #f5f7fa;
        color: #303133;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header { margin-bottom: 14px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 4px 0 0; color: #606266; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      section {
        overflow: hidden;
        min-width: 0;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgb(0 0 0 / 5%);
      }
      h2 {
        margin: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #ebeef5;
        font-size: 16px;
      }
      .frame {
        display: flex;
        height: 545px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #fafafa;
      }
      img { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <header>
      <h1>按钮外观实现对照</h1>
      <p>参考要求：默认外观保持现状，并在 plain、round、circle 中互斥选择一种。</p>
    </header>
    <main>
      <section>
        <h2>参考图</h2>
        <div class="frame">
          <img src="/design-qa-button-appearance-source.png" alt="Element 按钮外观参考" />
        </div>
      </section>
      <section>
        <h2>实现图</h2>
        <div class="frame">
          <img src="/design-qa-button-appearance-default.jpg" alt="表单按钮外观设置实现" />
        </div>
      </section>
    </main>
  </body>
</html>
